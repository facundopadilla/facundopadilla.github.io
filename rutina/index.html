async function open(pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));return new TextDecoder().decode(pt)}
async function go(pw,remember){const h=await open(pw);if(remember)localStorage.setItem('rutina-pw',pw);window.RUTINA_PW=pw;try{sessionStorage.setItem('rutina-pw-s',pw)}catch(e){}document.open();document.write(h);document.close()}
const saved=localStorage.getItem('rutina-pw');if(saved)go(saved,false).catch(()=>localStorage.removeItem('rutina-pw'));
