const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));return new TextDecoder().decode(pt)}
async function go(pw,remember){const h=await open(pw);if(remember)localStorage.setItem('rutina-pw',pw);document.open();document.write(h);document.close()}
const saved=localStorage.getItem('rutina-pw');if(saved)go(saved,false).catch(()=>localStorage.removeItem('rutina-pw'));
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('b');b.textContent='Abriendo…';b.disabled=true;
try{await go(document.getElementById('p').value,document.getElementById('r').checked)}catch(x){document.getElementById('e').textContent='Clave incorrecta';b.textContent='Entrar';b.disabled=false}};
